# ===================================================================
# Profile: H2 (Zero External Installation Required)
# ===================================================================
# Uses a persistent file-based embedded database stored in the ./data directory
# or memory. Tables and data will be automatically generated and seeded on startup.
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/food_order_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
